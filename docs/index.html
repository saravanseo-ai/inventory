<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Inventory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  header { padding: 12px 0; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  #meta { font-size: .8rem; opacity: .7; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .controls input, .controls select { padding: 8px; font-size: 1rem; flex: 1 1 140px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #8884; text-align: left; white-space: nowrap; }
  td.num { text-align: right; }
  tr.mismatch td.diff { color: #d9534f; font-weight: bold; }
  tr.ok td.diff { color: #5cb85c; }
  .status { font-size: .8rem; margin-top: 8px; opacity: .8; }
</style>
</head>
<body>
<header>
  <h1>Fulfillment inventory</h1>
  <div id="meta">Loading…</div>
</header>
<div class="controls">
  <select id="center"><option value="">All centers</option><option>amazon</option><option>walmart</option></select>
  <input id="search" type="search" placeholder="Search SKU, barcode, or description">
  <label><input type="checkbox" id="mismatch"> Mismatches only</label>
</div>
<div class="table-wrap">
  <table>
    <thead><tr>
      <th>Center</th><th>SKU</th><th>Barcode</th><th>Description</th>
      <th class="num">Ledger</th><th class="num">Platform</th><th class="num">Diff</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="status" class="status"></div>
<script src="app.js"></script>
</body>
</html>
